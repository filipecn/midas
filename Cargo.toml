[package]
name = "midas"
version = "0.1.0"
edition = "2024"

[dependencies]
# UI and Terminal Rendering
ratatui = "0.30.1"
crossterm = "0.29.0"
ratatui-interact = "0.5.3"
tui-logger = { version = "0.18.0", features = ["crossterm"] }
thiserror = "1.0"
log = "0.4"
color-eyre = "0.6"
# Async runtime to execute our async main function
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.19"
# Async HTTP Client for making requests
reqwest = { version = "0.12", features = ["json", "blocking"] }
scraper = "0.20"
encoding_rs = "0.8"

market-data = "0.5.1"
moka = { version = "0.12", features = ["sync"] }

# Data Serialization and CSV parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Database Storage
rusqlite = { version = "0.40.1", features = ["bundled", "chrono"] }

# Date and Time
chrono = { version = "0.4.39", features = ["serde"] }

# CLI Argument Parsing
clap = { version = "4.5.0", features = ["derive"] }

# Pattern Matching
regex = "1.13.0"
once_cell = "1.20"
